name: Learning workspace protection regression
on:
  pull_request:
    paths:
      - "src/filesteward/protect/**"
      - "src/filesteward/run.py"
      - "src/filesteward/deletion/**"
      - "src/filesteward/classify/**"
      - "tests/test_learning_workspace_protection.py"
      - "tests/test_protection.py"
      - "tests/test_disposition.py"
      - "tests/test_delete_preflight.py"
      - ".github/workflows/learning-workspace-safety.yml"
  push:
    branches: [main]
    paths:
      - "src/filesteward/protect/**"
      - "src/filesteward/run.py"
      - "src/filesteward/deletion/**"
      - "src/filesteward/classify/**"
      - "tests/test_learning_workspace_protection.py"
      - ".github/workflows/learning-workspace-safety.yml"

permissions:
  contents: read

jobs:
  synthetic-protection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest -q
          tests/test_learning_workspace_protection.py
          tests/test_protection.py
          tests/test_disposition.py
          tests/test_delete_preflight.py
