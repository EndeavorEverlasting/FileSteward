name: Mobile storage policy
on:
  pull_request:
    paths:
      - "src/filesteward/mobile/**"
      - "tests/test_mobile_storage_policy.py"
      - "harness/contracts/mobile-storage-capability.v1.json"
      - ".github/workflows/mobile-storage-policy.yml"
  push:
    branches:
      - "feat/mobile-storage-capability-floor-20261013"
    paths:
      - "src/filesteward/mobile/**"
      - "tests/test_mobile_storage_policy.py"
      - "harness/contracts/mobile-storage-capability.v1.json"
      - ".github/workflows/mobile-storage-policy.yml"
jobs:
  synthetic-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m json.tool harness/contracts/mobile-storage-capability.v1.json > /dev/null
      - run: python -m pytest -q tests/test_mobile_storage_policy.py
